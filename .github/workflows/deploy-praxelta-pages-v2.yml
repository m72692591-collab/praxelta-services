name: Deploy and verify PRAXELTA Pages V2

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.mjs"
      - "*.xml"
      - "*.txt"
      - "output/pdf/**"
      - ".github/workflows/deploy-praxelta-pages-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: praxelta-pages-production
  cancel-in-progress: false

env:
  PUBLIC_URL: https://m72692591-collab.github.io/praxelta-services/

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run complete repository preflight
        run: |
          python scripts/check_public_site.py
          node scripts/test_service_network_js.mjs
          python -m pytest -q
          git diff --check

      - name: Build allowlisted public artifact and referenced JSON only
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import shutil
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('.')
          out=Path('_site_v2')
          if out.exists():
              shutil.rmtree(out)
          (out/'output/pdf').mkdir(parents=True)

          public_suffixes={'.html','.css','.js','.mjs','.xml','.txt','.svg','.png','.jpg','.jpeg','.webp','.ico'}
          public_files=[]
          for path in root.iterdir():
              if path.is_file() and path.suffix.casefold() in public_suffixes:
                  shutil.copy2(path,out/path.name)
                  public_files.append(path)
          pdf_root=root/'output/pdf'
          if pdf_root.is_dir():
              for path in pdf_root.rglob('*'):
                  if path.is_file() and path.suffix.casefold()=='.pdf':
                      destination=out/'output/pdf'/path.relative_to(pdf_root)
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(path,destination)

          reference_pattern=re.compile(r'''(?i)(?:fetch\s*\(\s*["']|href\s*=\s*["']|src\s*=\s*["'])([^"']+\.json)(?:[?#][^"']*)?["']''')
          referenced=set()
          for path in public_files:
              text=path.read_text(encoding='utf-8',errors='replace')
              for match in reference_pattern.finditer(text):
                  value=match.group(1).strip().lstrip('./')
                  candidate=Path(value)
                  if candidate.is_absolute() or '..' in candidate.parts:
                      raise SystemExit(f'Unsafe JSON reference: {value}')
                  referenced.add(candidate.as_posix())

          for always in ('pricing.json',):
              if (root/always).is_file():
                  referenced.add(always)

          for relative in sorted(referenced):
              source=root/relative
              if not source.is_file() or source.suffix.casefold()!='.json':
                  raise SystemExit(f'Referenced public JSON missing: {relative}')
              destination=out/relative
              destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(source,destination)

          (out/'.nojekyll').write_text('',encoding='utf-8')
          if not (out/'index.html').is_file():
              raise SystemExit('index.html missing from public artifact')
          if not (out/'styles.css').is_file():
              raise SystemExit('styles.css missing from public artifact')

          secret_assignment=re.compile(r'(?i)(password|secret|token|credential|session)[\s_-]*[:=]')
          rejected=re.compile(r'(?iu)(?<![а-яa-z0-9])(поток|potok)(?![а-яa-z0-9])')
          allowed_markers=('legacy_compatibility_only','rejected_active_name','запрещ','устаревш','историческ','старый адрес','перенаправ')
          for path in out.rglob('*'):
              if not path.is_file() or path.suffix.casefold() not in {'.html','.css','.js','.mjs','.json','.xml','.txt'}:
                  continue
              text=path.read_text(encoding='utf-8',errors='replace')
              if secret_assignment.search(text):
                  raise SystemExit(f'Secret-like assignment in public artifact: {path}')
              for line in text.splitlines():
                  if rejected.search(line) and not any(marker in line.casefold() for marker in allowed_markers):
                      raise SystemExit(f'Rejected active brand in public artifact: {path}')

          files=[]
          for path in sorted(item for item in out.rglob('*') if item.is_file()):
              data=path.read_bytes()
              files.append({
                  'path':path.relative_to(out).as_posix(),
                  'size_bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
              })
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          manifest={
              'schema_version':2,
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'project':'ПРАКСЕЛЬТА',
              'status':'STATIC_ARTIFACT_VERIFIED_DEPLOYMENT_PENDING',
              'source_commit':commit,
              'public_url':'https://m72692591-collab.github.io/praxelta-services/',
              'file_count':len(files),
              'referenced_public_json':sorted(referenced),
              'files':files,
              'internal_governance_json_published':False,
              'production_backend_enabled':False,
              'automated_live_lead_collection_enabled':False,
              'live_payments_enabled':False,
              'paid_actions_enabled':False,
              'customer_data_exported':False,
          }
          (out/'PRAXELTA_RELEASE_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'file_count':len(files),'referenced_json':sorted(referenced)},ensure_ascii=False))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_v2

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact public artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Retry live manifest until exact source commit is visible
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "$PUBLIC_URL/PRAXELTA_RELEASE_MANIFEST.json?verify=$GITHUB_SHA-$attempt" \
              -o live-manifest.json; then
              if python - "$GITHUB_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          data=json.loads(Path('live-manifest.json').read_text(encoding='utf-8'))
          expected=sys.argv[1]
          assert data['schema_version']==2
          assert data['project']=='ПРАКСЕЛЬТА'
          assert data['source_commit']==expected,(data['source_commit'],expected)
          assert data['internal_governance_json_published'] is False
          assert data['production_backend_enabled'] is False
          assert data['automated_live_lead_collection_enabled'] is False
          assert data['live_payments_enabled'] is False
          assert data['customer_data_exported'] is False
          PY
              then
                break
              fi
            fi
            if [ "$attempt" = 36 ]; then
              echo 'Exact live release manifest was not observed.' >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error --location \
            -H 'Cache-Control: no-cache' \
            "$PUBLIC_URL?verify=$GITHUB_SHA" -o live-index.html
          grep -q 'ПРАКСЕЛЬТА' live-index.html
          ! grep -Eqi '(>Поток<|>Potok<|Публичная витрина услуг ПОТОК)' live-index.html

      - name: Build factual deployment receipt
        run: |
          mkdir -p deployment-evidence-v2
          python - <<'PY'
          import hashlib,json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          live_manifest=Path('live-manifest.json').read_bytes()
          live_index=Path('live-index.html').read_bytes()
          source_index=Path('index.html').read_bytes()
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          payload={
              'schema_version':2,
              'verified_at_utc':datetime.now(timezone.utc).isoformat(),
              'status':'DEPLOYMENT_VERIFIED',
              'project':'ПРАКСЕЛЬТА',
              'public_url':'https://m72692591-collab.github.io/praxelta-services/',
              'source_commit':commit,
              'live_manifest_sha256':hashlib.sha256(live_manifest).hexdigest(),
              'source_index_sha256':hashlib.sha256(source_index).hexdigest(),
              'live_index_sha256':hashlib.sha256(live_index).hexdigest(),
              'brand_verified':True,
              'https_verified':True,
              'exact_source_commit_verified':True,
              'production_backend_enabled':False,
              'automated_live_lead_collection_enabled':False,
              'live_payments_enabled':False,
              'first_real_client_verified':False,
              'revenue_verified':False,
              'customer_data_exported':False,
          }
          Path('deployment-evidence-v2/PRAXELTA_DEPLOYMENT_RECEIPT_V2.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload immutable receipt
        uses: actions/upload-artifact@v4
        with:
          name: praxelta-deployment-receipt-v2-${{ github.run_number }}
          path: deployment-evidence-v2
          if-no-files-found: error
          retention-days: 90

      - name: Publish latest verified receipt to audit branch
        shell: bash
        run: |
          set -euo pipefail
          branch='audit/deployment-latest'
          worktree="$RUNNER_TEMP/praxelta-deployment-v2"
          rm -rf "$worktree"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git worktree add --detach "$worktree" "refs/remotes/origin/$branch"
            git -C "$worktree" switch -C "$branch" "refs/remotes/origin/$branch"
          else
            git worktree add -b "$branch" "$worktree" HEAD
          fi
          destination="$worktree/audit/deployment-latest"
          rm -rf "$destination"
          mkdir -p "$destination"
          cp deployment-evidence-v2/PRAXELTA_DEPLOYMENT_RECEIPT_V2.json "$destination/"
          git -C "$worktree" config user.name github-actions[bot]
          git -C "$worktree" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$worktree" add audit/deployment-latest
          if ! git -C "$worktree" diff --cached --quiet; then
            git -C "$worktree" commit -m 'Обновить verified deployment receipt V2 ПРАКСЕЛЬТЫ'
            git -C "$worktree" push origin "HEAD:$branch"
          fi

      - name: Record verified static launch without commercial overclaim
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[STATIC DEPLOYMENT VERIFIED] ПРАКСЕЛЬТА'
          body="Публичный URL и live manifest проверены по exact source commit \`$GITHUB_SHA\`: $PUBLIC_URL. Immutable receipt загружена и сохранена в \`audit/deployment-latest\`. Это подтверждает статический запуск. Production backend, automated live leads, live payments, first real client и revenue остаются отдельными внешними воротами."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$title in:title" --json number,state --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            state="$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            if [ "$state" = 'OPEN' ]; then gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed; fi
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
