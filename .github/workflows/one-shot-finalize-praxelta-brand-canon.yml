name: One-shot finalize PRAXELTA brand canon

on:
  push:
    branches:
      - "governance/praxelta-brand-canon-20260817"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: one-shot-finalize-praxelta-brand-canon
  cancel-in-progress: false

jobs:
  verify-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: governance/praxelta-brand-canon-20260817
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical registry and produce factual migration report
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_brand_terms.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('brand_registry.json').read_text(encoding='utf-8'))
          brand = registry['canonical_brand']
          assert brand['canonical_ru'] == 'ПРАКСЕЛЬТА'
          assert brand['canonical_latin'] == 'PRAXELTA'
          assert brand['status'] == 'CANONICAL_PUBLIC'
          assert registry['separation']['independent_from'] == 'ANIMA TACTUS'
          assert registry['separation']['shared_customer_data_allowed'] is False
          assert registry['legacy_repository']['status'] == 'LEGACY_COMPATIBILITY_ONLY'
          assert registry['legacy_repository']['new_development_allowed'] is False
          PY
          mkdir -p operations/branding
          python scripts/audit_brand_terms.py \
            --root . \
            --report operations/branding/BRAND_MIGRATION_REPORT.json
          git diff --check

      - name: Preserve exact metadata blocker when description is not canonical
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          description="$(gh api repos/m72692591-collab/praxelta-services --jq '.description // ""')"
          printf '%s\n' "$description" > operations/branding/CURRENT_GITHUB_DESCRIPTION.txt
          required='Публичная витрина и рабочие материалы ПРАКСЕЛЬТЫ'
          if [ "$description" != "$required" ]; then
            title='[P0 METADATA] Заменить описание репозитория на каноническое ПРАКСЕЛЬТА'
            existing="$(gh issue list \
              --repo m72692591-collab/praxelta-services \
              --state open \
              --search "$title in:title" \
              --json number,title \
              --jq '.[] | select(.title == "'"$title"'") | .number' \
              | head -n 1)"
            body="GitHub description — отдельная публичная metadata-поверхность. Требуемая точная строка: \`${required}\`. Текущее API-значение сохранено в \`operations/branding/CURRENT_GITHUB_DESCRIPTION.txt\`. Закрыть задачу можно только после повторного API-чтения точной канонической строки. Файлы, ветки и история не удаляются."
            if [ -z "$existing" ]; then
              gh issue create \
                --repo m72692591-collab/praxelta-services \
                --title "$title" \
                --body "$body"
            fi
          fi

      - name: Remove one-shot helpers and commit verified governance
        run: |
          rm -f \
            .github/workflows/one-shot-merge-praxelta-brand-governance.yml \
            .github/workflows/one-shot-finalize-praxelta-brand-canon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Зафиксировать канон бренда и фактическую карту миграции ПРАКСЕЛЬТЫ'
            git push origin HEAD:governance/praxelta-brand-canon-20260817
          fi

      - name: Merge verified brand canon without deleting branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh pr view 4 --repo m72692591-collab/praxelta-services --json state --jq '.state')"
          if [ "$state" = 'OPEN' ]; then
            gh pr merge 4 \
              --repo m72692591-collab/praxelta-services \
              --squash \
              --subject 'Закрепить ПРАКСЕЛЬТУ как единственный активный бренд' \
              --body 'Добавлены канон, machine registry и factual migration audit. Старый общий бренд запрещён в активном использовании; legacy redirect и разделение от ANIMA TACTUS защищены.'
          fi
