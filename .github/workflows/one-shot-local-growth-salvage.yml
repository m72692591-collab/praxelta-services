name: One-shot local growth salvage

on:
  push:
    branches:
      - "cleanup/local-growth-salvage-20260817"

permissions:
  contents: write

concurrency:
  group: one-shot-local-growth-salvage
  cancel-in-progress: true

jobs:
  audit-copy-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/local-growth-salvage-20260817
          fetch-depth: 0
          show-progress: false

      - name: Fetch historical branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/feature/local-service-growth:refs/remotes/origin/feature/local-service-growth

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install public QA dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile and test salvage tool
        run: |
          python -m py_compile scripts/audit_local_growth_branch.py tests/test_audit_local_growth_branch.py
          python -m unittest tests/test_audit_local_growth_branch.py -v

      - name: Copy exact safe target-only files and build report
        run: |
          python scripts/audit_local_growth_branch.py \
            --current-ref origin/main \
            --historical-ref origin/feature/local-service-growth

      - name: Validate resulting public site
        run: |
          python scripts/check_public_site.py
          node scripts/test_service_network_js.mjs
          git diff --check

      - name: Commit result and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-local-growth-salvage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No salvage changes required."
            exit 0
          fi
          git commit -m "Безопасно перенести уникальные материалы локального продвижения"
          git push origin HEAD:cleanup/local-growth-salvage-20260817
