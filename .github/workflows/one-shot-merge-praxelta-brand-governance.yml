name: One-shot merge PRAXELTA brand governance

on:
  push:
    branches:
      - governance/praxelta-brand-canon-20260817

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-shot-praxelta-brand-governance
  cancel-in-progress: false

jobs:
  audit-persist-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact governance branch
        uses: actions/checkout@v4
        with:
          ref: governance/praxelta-brand-canon-20260817
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and build factual migration report
        run: |
          python -m py_compile scripts/audit_brand_terms.py
          python scripts/audit_brand_terms.py \
            --root . \
            --report brand-audit-report.json
          mkdir -p operations/branding
          cp brand-audit-report.json operations/branding/BRAND_MIGRATION_REPORT.json
          python - <<'PY'
          import json
          report = json.load(open('brand-audit-report.json', encoding='utf-8'))
          assert report['canonical_brand'] == 'ПРАКСЕЛЬТА / PRAXELTA'
          assert report['status'] in {'PASS', 'REVIEW', 'FAIL'}
          print(json.dumps({
              'status': report['status'],
              'active_violation_count': report['active_violation_count'],
              'review_required_count': report['review_required_count'],
              'finding_count': report['finding_count'],
          }, ensure_ascii=False))
          PY

      - name: Remove one-shot workflow and commit evidence
        run: |
          rm .github/workflows/one-shot-merge-praxelta-brand-governance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            operations/branding/BRAND_MIGRATION_REPORT.json \
            .github/workflows/one-shot-merge-praxelta-brand-governance.yml
          git commit -m "Сохранить фактическую карту миграции бренда ПРАКСЕЛЬТА"
          git push origin HEAD:governance/praxelta-brand-canon-20260817

      - name: Merge verified governance pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge 4 \
            --repo m72692591-collab/praxelta-services \
            --squash \
            --subject "Закрепить ПРАКСЕЛЬТУ как единственный активный бренд" \
            --body "Добавляет канонический реестр, безопасный аудит старого общего имени и фактическую карту миграции. Массовая замена и удаление истории не выполняются."
