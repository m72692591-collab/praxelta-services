name: Normalize PRAXELTA repository metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-normalize-praxelta-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-normalize-praxelta-metadata
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" \
            --method PATCH \
            -f description='ПРАКСЕЛЬТА — публичная витрина безопасного продвижения и сервисной координации' \
            -f homepage='https://m72692591-collab.github.io/praxelta-services/' \
            -F has_issues=true \
            -F has_projects=true \
            -F has_wiki=false

      - name: Remove one-shot workflow after success
        run: |
          rm .github/workflows/one-shot-normalize-praxelta-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-shot-normalize-praxelta-metadata.yml
          git commit -m 'Удалить выполненный one-shot нормализатор метаданных'
          git push origin HEAD:main
