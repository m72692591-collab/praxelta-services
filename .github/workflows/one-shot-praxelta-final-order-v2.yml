name: PRAXELTA final order v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-praxelta-final-order-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: praxelta-final-order-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || secrets.GH_PAT || secrets.GITHUB_PAT || secrets.MAESTRO_GITHUB_TOKEN || secrets.PAT || github.token }}
    steps:
      - name: Checkout latest full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize before work
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git pull --ff-only origin main

      - name: Merge known product branches without automatic conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p operations/repository_cleanup
          report=operations/repository_cleanup/CONSOLIDATION_STATUS_V2.md
          printf '# Консолидация ПРАКСЕЛЬТЫ V2\n\n| Ветка | Статус |\n|---|---|\n' > "$report"
          for branch in feature/local-service-growth agent/praxelta-marketplaces-zero-budget; do
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              printf '| `%s` | ветка уже архивирована или отсутствует |\n' "$branch" >> "$report"
              continue
            fi
            if git merge-base --is-ancestor "$ref" HEAD; then
              printf '| `%s` | уже содержится в `main` |\n' "$branch" >> "$report"
              continue
            fi
            if git merge --no-ff --no-edit "$ref"; then
              printf '| `%s` | объединена без конфликта |\n' "$branch" >> "$report"
            else
              git merge --abort || true
              printf '| `%s` | BLOCKED: конфликт, изменений нет |\n' "$branch" >> "$report"
              exit 1
            fi
          done

      - name: Normalize current active brand
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re
          from pathlib import Path
          allowed={'.html','.css','.js','.json','.md','.txt','.xml','.yml','.yaml','.csv','.py'}
          excluded_dirs={'.git','archive','archives','historical','history','node_modules','.venv','venv'}
          excluded_names={
              'REPOSITORY_STATUS.md','BRAND_NORMALIZATION.md','BRAND_NORMALIZATION.json',
              'LEGACY_REDIRECT_STATUS.md','one-shot-praxelta-final-order-v2.yml',
          }
          patterns=[re.compile(r'(?iu)(?<![\w-])поток(?![\w-])'),re.compile(r'(?i)(?<![\w-])POTOK(?![\w-])')]
          changed=[]
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or path.suffix.lower() not in allowed: continue
              if path.name in excluded_names or any(part in excluded_dirs for part in path.parts): continue
              try: before=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              after=before
              for pattern in patterns: after=pattern.sub('ПРАКСЕЛЬТА',after)
              if after != before:
                  path.write_text(after,encoding='utf-8')
                  changed.append({'path':path.as_posix(),'before_sha256':hashlib.sha256(before.encode()).hexdigest(),'after_sha256':hashlib.sha256(after.encode()).hexdigest()})
          out=Path('operations/repository_cleanup'); out.mkdir(parents=True,exist_ok=True)
          (out/'BRAND_NORMALIZATION_V2.json').write_text(json.dumps({'schema_version':2,'canonical_brand':'ПРАКСЕЛЬТА','changed':changed},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'BRAND_NORMALIZATION_V2.md').write_text('# Бренд ПРАКСЕЛЬТА\n\nАктивные публичные и операционные материалы используют только **ПРАКСЕЛЬТА**.\n\nИзменено файлов: **%d**.\n' % len(changed),encoding='utf-8')
          PY

      - name: Verify current site and code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/check_public_site.py ]]; then python scripts/check_public_site.py; fi
          if [[ -d tests ]]; then python -m pytest -q; fi
          if [[ -f package.json ]]; then npm ci && npm test --if-present; fi
          git diff --check
          mapfile -t forbidden < <(
            grep -RIlE '(^|[^[:alnum:]_-])(поток|POTOK)([^[:alnum:]_-]|$)' . \
              --include='*.html' --include='*.css' --include='*.js' --include='*.json' \
              --include='*.txt' --include='*.xml' --include='*.yml' --include='*.yaml' \
              --include='*.csv' --include='*.py' \
              --exclude='REPOSITORY_STATUS.md' --exclude='BRAND_NORMALIZATION*.md' --exclude='BRAND_NORMALIZATION*.json' \
              --exclude='one-shot-praxelta-final-order-v2.yml' --exclude-dir='.git' --exclude-dir='archive' --exclude-dir='archives' \
              --exclude-dir='historical' --exclude-dir='history' || true
          )
          if (( ${#forbidden[@]} > 0 )); then printf 'Forbidden active brand remains:\n%s\n' "${forbidden[*]}" >&2; exit 1; fi

      - name: Commit and push verified content before repository operations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Завершить консолидацию и бренд ПРАКСЕЛЬТА V2'; fi
          git push origin HEAD:main

      - name: Close PRs whose heads are already contained
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          for number in $(gh pr list --state open --limit 100 --json number --jq '.[].number'); do
            head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --jq .head.ref)"
            ref="refs/remotes/origin/$head"
            if git show-ref --verify --quiet "$ref" && git merge-base --is-ancestor "$ref" origin/main; then
              gh api "repos/${GITHUB_REPOSITORY}/pulls/$number" --method PATCH -f state=closed >/dev/null
            fi
          done

      - name: Archive fully contained branch heads before deleting refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          mapfile -t open_heads < <(gh pr list --state open --limit 100 --json headRefName --jq '.[].headRefName')
          mkdir -p operations/repository_cleanup
          report=operations/repository_cleanup/BRANCH_ARCHIVE_V2.md
          printf '# Архив веток ПРАКСЕЛЬТЫ V2\n\n| Ветка | Действие | Архивный тег |\n|---|---|---|\n' > "$report"
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            case "$branch" in HEAD|main|gh-pages|audit/*|release/*|production/*) continue ;; esac
            skip=0; for head in "${open_heads[@]:-}"; do [[ "$head" == "$branch" ]] && skip=1; done
            if [[ "$skip" == 1 ]]; then printf '| `%s` | сохранена: открытый PR | — |\n' "$branch" >> "$report"; continue; fi
            if git merge-base --is-ancestor "$ref" origin/main; then
              tag="archive/branches/$branch"; sha="$(git rev-parse "$ref")"
              if ! git show-ref --verify --quiet "refs/tags/$tag"; then git tag "$tag" "$sha"; git push origin "refs/tags/$tag"; fi
              git push origin --delete "$branch"
              printf '| `%s` | exact head архивирован, ref удалён | `%s` |\n' "$branch" "$tag" >> "$report"
            else
              printf '| `%s` | сохранена: уникальные коммиты | — |\n' "$branch" >> "$report"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

      - name: Repair and independently verify live metadata
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -n '{description:"ПРАКСЕЛЬТА — публичная витрина безопасного продвижения и сервисной координации",homepage:"https://m72692591-collab.github.io/praxelta-services/",has_issues:true,has_projects:true,has_wiki:false}')"
          code="$(curl -sS -o /tmp/repo-patch.json -w '%{http_code}' -X PATCH -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $ADMIN_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY" -d "$body")"
          echo "PATCH_HTTP=$code"
          curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY" > /tmp/repo-live.json
          jq -e '.description == "ПРАКСЕЛЬТА — публичная витрина безопасного продвижения и сервисной координации" and .homepage == "https://m72692591-collab.github.io/praxelta-services/"' /tmp/repo-live.json >/dev/null

      - name: Build final PASS gate and self-remove
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          open_pr_count="$(gh pr list --state open --limit 100 --json number --jq 'length')"
          [[ "$open_pr_count" == 0 ]]
          branch_count="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | wc -l | tr -d ' ')"
          mkdir -p operations/repository_cleanup
          jq -n --arg status PASS --arg canonical_brand ПРАКСЕЛЬТА --argjson open_pr_count "$open_pr_count" --argjson branch_count "$branch_count" '{schema_version:2,status,canonical_brand,open_pr_count,branch_count,tests_passed:true,live_metadata_verified:true,unique_branches_preserved:true,fully_merged_heads_archived:true}' > operations/repository_cleanup/FINAL_GATE_V2.json
          {
            echo '# Финальный порядок ПРАКСЕЛЬТЫ V2'; echo
            echo '- Статус: **PASS**'; echo '- Открытых PR: **0**'
            echo "- Веток после архивирования: **$branch_count**"
            echo '- Активный бренд и GitHub-метаданные: **ПРАКСЕЛЬТА**'
            echo '- Уникальные ветки сохранены; полностью слитые exact heads сохранены тегами.'
          } > operations/repository_cleanup/FINAL_GATE_V2.md
          rm .github/workflows/one-shot-praxelta-final-order-v2.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/repository_cleanup .github/workflows/one-shot-praxelta-final-order-v2.yml
          git commit -m 'Зафиксировать финальный порядок ПРАКСЕЛЬТЫ V2: PASS'
          git push origin HEAD:main
          git tag -f status/final-order-pass-v2
          git push origin refs/tags/status/final-order-pass-v2 --force
