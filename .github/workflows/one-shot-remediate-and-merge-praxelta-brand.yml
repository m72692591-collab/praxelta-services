name: One-shot remediate and merge PRAXELTA active brand

on:
  push:
    branches:
      - governance/praxelta-active-name-migration-20260817

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: one-shot-remediate-praxelta-brand
  cancel-in-progress: false

jobs:
  remediate-verify-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact migration branch
        uses: actions/checkout@v4
        with:
          ref: governance/praxelta-active-name-migration-20260817
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run deterministic tests
        run: |
          python -m py_compile \
            scripts/audit_brand_terms.py \
            scripts/remediate_active_brand_terms.py \
            tests/test_brand_remediation.py
          python -m unittest tests/test_brand_remediation.py -v

      - name: Build dry-run evidence and apply only classified active lines
        run: |
          python scripts/remediate_active_brand_terms.py \
            --root . \
            --report brand-remediation-dry-run.json
          python scripts/remediate_active_brand_terms.py \
            --root . \
            --report operations/branding/BRAND_REMEDIATION_REPORT.json \
            --apply

      - name: Enable strict active-brand enforcement
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/praxelta-brand-audit.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'python scripts/audit_brand_terms.py --root . --report brand-audit-report.json',
              'python scripts/audit_brand_terms.py --root . --report brand-audit-report.json --strict',
          )
          text = text.replace(
              "This first migration workflow reports facts; strict blocking is enabled after active files are corrected.",
              "Strict blocking is active: any rejected common name on an active public surface fails CI.",
          )
          if '--strict' not in text:
              raise SystemExit('strict brand audit was not enabled')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove zero active violations after targeted migration
        run: |
          python scripts/audit_brand_terms.py \
            --root . \
            --report operations/branding/BRAND_AUDIT_AFTER_REMEDIATION.json \
            --strict
          python - <<'PY'
          import json
          remediation = json.load(open('operations/branding/BRAND_REMEDIATION_REPORT.json', encoding='utf-8'))
          after = json.load(open('operations/branding/BRAND_AUDIT_AFTER_REMEDIATION.json', encoding='utf-8'))
          assert remediation['historical_or_legacy_lines_modified'] is False
          assert remediation['mass_unclassified_replacement_used'] is False
          assert after['active_violation_count'] == 0
          print({
              'changed_file_count': remediation['changed_file_count'],
              'review_required_count': after['review_required_count'],
          })
          PY
          git diff --check

      - name: Remove one-shot workflow and commit verified migration
        run: |
          rm .github/workflows/one-shot-remediate-and-merge-praxelta-brand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Перевести активные поверхности на бренд ПРАКСЕЛЬТА и включить strict gate"
          git push origin HEAD:governance/praxelta-active-name-migration-20260817

      - name: Open and merge verified migration pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr_number="$(gh pr list \
            --repo m72692591-collab/praxelta-services \
            --state open \
            --head governance/praxelta-active-name-migration-20260817 \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --repo m72692591-collab/praxelta-services \
              --base main \
              --head governance/praxelta-active-name-migration-20260817 \
              --title "Точечно заменить старое активное название на ПРАКСЕЛЬТУ" \
              --body "Меняет только строки, заранее классифицированные как ACTIVE_VIOLATION. Legacy, история и slugs не переписываются. После миграции strict audit требует ноль активных нарушений.")"
            pr_number="${pr_url##*/}"
          fi
          gh pr merge "$pr_number" \
            --repo m72692591-collab/praxelta-services \
            --squash \
            --subject "Точечно заменить старое активное название на ПРАКСЕЛЬТУ" \
            --body "Классифицированная миграция без массовой замены, сохранённые evidence-отчёты и постоянный strict naming gate."

      - name: Create metadata-only blocker if repository description is still stale
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          description="$(gh api repos/m72692591-collab/praxelta-services --jq '.description // ""')"
          if printf '%s' "$description" | grep -Eiq '(^|[^[:alnum:]_-])(поток|potok)([^[:alnum:]_-]|$)'; then
            title='[P0 METADATA] Заменить описание репозитория на каноническое ПРАКСЕЛЬТА'
            existing="$(gh issue list \
              --repo m72692591-collab/praxelta-services \
              --state open \
              --search "$title in:title" \
              --json number,title \
              --jq '.[] | select(.title == "'"$title"'") | .number' \
              | head -n 1)"
            body='Текущие файлы проходят strict naming gate, но GitHub description остаётся отдельной metadata-поверхностью. Требуемое точное описание: `Публичная витрина и рабочие материалы ПРАКСЕЛЬТЫ`. Старое общее название запрещено. Закрыть задачу можно только после повторного API-чтения метаданных.'
            if [ -z "$existing" ]; then
              gh issue create \
                --repo m72692591-collab/praxelta-services \
                --title "$title" \
                --body "$body"
            fi
          fi
