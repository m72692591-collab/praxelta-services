name: One-shot patch current first-sale package

on:
  push:
    branches:
      - sales/first-express-case-current-20260818
    paths:
      - '.github/workflows/patch-first-sale-current.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-first-sale-current
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current sales branch
        uses: actions/checkout@v4
        with:
          ref: sales/first-express-case-current-20260818
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply bounded sales patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/FIRST_SALE_PACK_2026-08-17.md'): {
                  '## 5. Сообщение тёплому контакту — ремонт котлов':
                      '## 5. Сообщение тёплому контакту — локальная услуга',
                  'Хочу начать с реального кейса по ремонту бытовых котлов, потому что понимаю вашу услугу и уже вижу несколько мест, которые можно проверить без отключения рекламы и без доступа к паролям.':
                      'Хочу начать с реального кейса локального сервисного бизнеса и вижу несколько мест, которые можно проверить без отключения рекламы и без доступа к паролям.',
                  '- неясно, ремонтируется ли конкретная модель котла;':
                      '- неясно, какие конкретно модели, виды работ или ограничения входят в услугу;',
              },
              Path('docs/FIRST_SALE_SPRINT_2026-08-17.md'): {
                  '1. Тёплый контакт: ремонт бытовых котлов и отопления.':
                      '1. Локальная сервисная компания с действующей публичной карточкой или объявлением.',
                  '- первым поставить тёплый контакт по бытовым котлам и отоплению;':
                      '- первым поставить контакт, который уже дал явное согласие получить мини-разбор;',
                  '- отправить сообщение тёплому контакту;':
                      '- отправить первое сообщение контакту с подтверждённым согласием либо через разрешённый правилами площадки канал;',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              missing = [old for old in mapping if old not in text]
              if missing:
                  raise SystemExit(f'PATCH_CONTRACT_DRIFT {path}: {missing!r}')
              for old, new in mapping.items():
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='\n')

          print('FIRST_SALE_CURRENT_PATCH_PASS')
          PY
          git diff --check

      - name: Commit only the two sales documents
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FIRST_SALE_PACK_2026-08-17.md docs/FIRST_SALE_SPRINT_2026-08-17.md
          git diff --cached --check
          git commit -m 'Обновить первый спринт продажи по фактическим сигналам'
          git push origin HEAD:sales/first-express-case-current-20260818
