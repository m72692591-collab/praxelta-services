name: PRAXELTA public quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praxelta-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the public site
        run: python scripts/check_public_site.py

      - name: Run JavaScript smoke tests
        run: node scripts/test_service_network_js.mjs

      - name: Run Python tests when present
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) \
            ! -path './.git/*' | grep -q .; then
            python -m pytest -q
          else
            echo 'No Python test files are present; deterministic public-site and JavaScript checks remain mandatory.'
          fi

      - name: Reject whitespace errors
        run: git diff --check
