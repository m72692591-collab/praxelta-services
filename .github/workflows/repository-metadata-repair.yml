name: PRAXELTA repository metadata repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repository-metadata-repair.yml"
      - "scripts/repair_repository_metadata.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: praxelta-repository-metadata-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_DESCRIPTION: "Публичная витрина и рабочие материалы ПРАКСЕЛЬТЫ"
      EXPECTED_HOMEPAGE: "https://m72692591-collab.github.io/praxelta-services/"
      TOKEN_PRAXELTA: ${{ secrets.PRAXELTA_REPO_ADMIN_TOKEN }}
      TOKEN_REPO_ADMIN: ${{ secrets.REPO_ADMIN_TOKEN }}
      TOKEN_GH_ADMIN: ${{ secrets.GH_ADMIN_TOKEN }}
      TOKEN_GH_PAT: ${{ secrets.GH_PAT }}
      TOKEN_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      TOKEN_PAT: ${{ secrets.PAT }}
      TOKEN_DEFAULT: ${{ github.token }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Attempt PATCH and perform a fresh API read
        id: repair
        shell: bash
        run: |
          set +e
          python scripts/repair_repository_metadata.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-description "$EXPECTED_DESCRIPTION" \
            --expected-homepage "$EXPECTED_HOMEPAGE" \
            --receipt governance/REPOSITORY_METADATA_RECEIPT.json \
            --github-output "$GITHUB_OUTPUT"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -s governance/REPOSITORY_METADATA_RECEIPT.json

      - name: Commit only verified metadata receipt
        if: steps.repair.outputs.verified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add governance/REPOSITORY_METADATA_RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Подтвердить исправленное GitHub description ПРАКСЕЛЬТЫ'
            git push origin HEAD:main
          fi

      - name: Close metadata blocker after exact verification
        if: steps.repair.outputs.verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue close 24 --repo "$GITHUB_REPOSITORY" --reason completed --comment \
            "Свежий API GET подтвердил точный GitHub description: \`$EXPECTED_DESCRIPTION\`. Homepage и default branch также совпадают. Санитизированная receipt обновлена в main."

      - name: Keep one exact blocker when no admin token succeeded
        if: steps.repair.outputs.verified != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          summary="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('governance/REPOSITORY_METADATA_RECEIPT.json').read_text(encoding='utf-8'))
          print(data.get('error_summary') or data.get('status'))
          PY
          )"
          gh issue comment 24 --repo "$GITHUB_REPOSITORY" --body \
            "Автоматический metadata repair повторно выполнил PATCH и свежий GET. Точное значение ещё не подтверждено. Санитизированный blocker: \`$summary\`. Никакие token values не записаны. Нужен repository-administration-capable credential или авторизованное изменение через Settings."
          exit 1
