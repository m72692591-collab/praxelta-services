name: Test MAESTRO Autopilot V4

on:
  pull_request:
    paths:
      - "tools/maestro/autopilot-v4-parts/**"
      - ".github/workflows/test-maestro-autopilot-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-autopilot-self-test:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact test commit
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Reconstruct exact launcher and verify SHA-256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $partsRoot = '.\tools\maestro\autopilot-v4-parts'
          $launcher = '.\tools\maestro\START_MAESTRO_AUTOPILOT_V4.cmd'
          $parts = @(Get-ChildItem -LiteralPath $partsRoot -Filter 'part*.b64' -File | Sort-Object Name)
          if ($parts.Count -ne 9) {
            throw "Expected 9 ordered payload parts, found $($parts.Count): $(@($parts.Name) -join ', ')"
          }
          $b64 = ((@($parts | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8
          }) -join '') -replace '\s', '')
          $compressed = [Convert]::FromBase64String($b64)
          $input = New-Object IO.MemoryStream(,$compressed)
          $gzip = New-Object IO.Compression.GzipStream($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create($launcher)
          try { $gzip.CopyTo($output) } finally { $output.Dispose(); $gzip.Dispose(); $input.Dispose() }
          $expected = 'ea49b1044582e74e03034f463245f5302c4730d609a34605a16bf75eb09cba34'
          $actual = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Launcher SHA mismatch: expected=$expected actual=$actual" }
          Write-Host "PAYLOAD_PARTS=$($parts.Count)"
          Write-Host "LAUNCHER_SHA256_OK=$actual"

      - name: Extract and parse embedded PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = '.\tools\maestro\START_MAESTRO_AUTOPILOT_V4.cmd'
          $text = [IO.File]::ReadAllText($launcher, [Text.Encoding]::UTF8)
          $marker = '###MAESTRO_AUTOPILOT_POWERSHELL_V4###'
          $index = $text.LastIndexOf($marker, [StringComparison]::Ordinal)
          if ($index -lt 0) { throw 'Embedded PowerShell marker is missing.' }
          $payload = $text.Substring($index + $marker.Length).TrimStart([char]13, [char]10)
          $temporary = Join-Path $env:TEMP 'MAESTRO_AUTOPILOT_V4_PARSE.ps1'
          [IO.File]::WriteAllText($temporary, $payload, (New-Object Text.UTF8Encoding($true)))
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($temporary, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) {
            $rendered = @($errors | ForEach-Object { '{0}:{1} {2}' -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message }) -join "`n"
            throw "Embedded PowerShell parse failed:`n$rendered"
          }
          Write-Host 'WINDOWS_POWERSHELL_5_1_PARSE_PASS'

      - name: Enforce non-destructive and persistence contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = '.\tools\maestro\START_MAESTRO_AUTOPILOT_V4.cmd'
          $raw = [IO.File]::ReadAllText($launcher, [Text.Encoding]::UTF8)
          $forbidden = @(
            '(?i)\bgit(?:\.exe)?\b[^\r\n]*\breset\b[^\r\n]*--hard',
            '(?i)\bgit(?:\.exe)?\b[^\r\n]*\bclean\b',
            '(?i)worktree[^\r\n]*remove[^\r\n]*--force',
            '(?i)\bpush\b[^\r\n]*--force',
            '(?i)\bbranch\b[^\r\n]*(?:-D|--delete)',
            '(?i)Remove-Item[^\r\n]*-Recurse[^\r\n]*-Force'
          )
          foreach ($pattern in $forbidden) {
            if ($raw -match $pattern) { throw "Forbidden destructive command: $pattern" }
          }
          foreach ($required in @(
            'AllowEmptyCollection',
            'Mode Watch',
            'Mode Run',
            'MAESTRO Safe Closure Autopilot V4',
            'LOCAL_EXTERNAL_GATES_PUBLIC.zip',
            'LOCAL_EXTERNAL_GATES_PRIVATE.zip',
            'MAESTRO_AUTOPILOT_V4_SELF_TEST_PASS',
            'MAESTRO_AUTOPILOT_V4_INSTALLED_AND_RUNNING'
          )) {
            if ($raw -notmatch [Regex]::Escape($required)) { throw "Required contract marker missing: $required" }
          }
          Write-Host 'AUTOPILOT_PERSISTENCE_AND_SAFETY_POLICY_PASS'

      - name: Run exact CMD regression and native Git self-test
        shell: cmd
        env:
          MAESTRO_AUTOPILOT_SELF_TEST: "1"
        run: tools\maestro\START_MAESTRO_AUTOPILOT_V4.cmd

      - name: Verify empty-list regression proof and create receipt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:TEMP 'MAESTRO_AUTOPILOT_V4_SELF_TEST_OK.txt'
          if (-not (Test-Path -LiteralPath $proof -PathType Leaf)) { throw "Self-test proof missing: $proof" }
          $value = (Get-Content -LiteralPath $proof -Raw -Encoding UTF8).Trim()
          if ($value -ne 'MAESTRO_AUTOPILOT_V4_SELF_TEST_PASS') { throw "Self-test proof mismatch: $value" }
          $launcher = '.\tools\maestro\START_MAESTRO_AUTOPILOT_V4.cmd'
          $receiptRoot = '.\autopilot-v4-test-evidence'
          New-Item -ItemType Directory -Path $receiptRoot -Force | Out-Null
          [ordered]@{
            schema_version = 4
            status = 'PASS'
            source_commit = $env:GITHUB_SHA
            launcher_sha256 = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
            windows_image = $env:ImageOS
            powershell_version = $PSVersionTable.PSVersion.ToString()
            parser = 'PASS'
            empty_collection_binding_regression = 'PASS'
            native_git_fixture = 'PASS'
            persistence_contract = 'PASS'
            cmd_self_test = 'PASS'
            branch_deletion = $false
            force_push = $false
            history_rewrite = $false
            git_reset_hard = $false
            git_clean = $false
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $receiptRoot 'MAESTRO_AUTOPILOT_V4_RECEIPT.json') -Encoding UTF8
          Copy-Item -LiteralPath $launcher -Destination (Join-Path $receiptRoot 'START_MAESTRO_AUTOPILOT_V4.cmd')

      - name: Upload immutable Windows V4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: maestro-autopilot-v4-${{ github.run_id }}
          path: autopilot-v4-test-evidence
          if-no-files-found: error
          retention-days: 90
