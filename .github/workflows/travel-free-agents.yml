name: PRAXELTA travel free agents

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - "travel-selection.*"
      - "travel-pilot.*"
      - "travel-pilot-content-pack.json"
      - "agents/**"
      - "operations/travel-selection/**"
      - "tests/test_travel_free_agents.py"
      - ".github/workflows/travel-free-agents.yml"
  push:
    branches:
      - main
    paths:
      - "travel-selection.*"
      - "travel-pilot.*"
      - "travel-pilot-content-pack.json"
      - "agents/**"
      - "operations/travel-selection/**"
      - "tests/test_travel_free_agents.py"
      - ".github/workflows/travel-free-agents.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: praxelta-travel-free-agents-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PUBLIC_BOT: "false"
      REAL_SEND: "false"
      REAL_MONEY: "false"
      REAL_LEAD_TRANSFER: "false"
      AD_SPEND: "false"
      ALLOW_EXTERNAL_LINKS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run free-agent orchestrator
        id: agents
        continue-on-error: true
        run: python agents/travel_free_agents.py --output artifacts/travel-free-agents

      - name: Validate public site
        id: preflight
        continue-on-error: true
        run: python scripts/check_public_site.py

      - name: Run focused travel safety tests
        id: tests
        continue-on-error: true
        run: |
          node scripts/test_travel_selection_js.mjs
          python -m pytest -q \
            tests/test_travel_free_agents.py \
            tests/test_travel_pilot_static.py

      - name: Prepare fallback report
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/travel-free-agents
          if [[ ! -f artifacts/travel-free-agents/status.md ]]; then
            cat > artifacts/travel-free-agents/status.md <<EOF
          <!-- PRAXELTA_TRAVEL_FREE_AGENTS_STATUS -->
          # ПРАКСЕЛЬТА Travel — бесплатные агенты

          **Статус:** \`FAIL\`

          Оркестратор не создал штатный отчёт. Проверьте run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          fi
          if [[ ! -f artifacts/travel-free-agents/status.json ]]; then
            printf '{"schema_version":1,"status":"FAIL","reason":"orchestrator_report_missing"}\n' \
              > artifacts/travel-free-agents/status.json
          fi

      - name: Upload agent artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praxelta-travel-free-agents-${{ github.run_number }}
          path: artifacts/travel-free-agents
          if-no-files-found: error
          retention-days: 30

      - name: Add report to job summary
        if: always()
        shell: bash
        run: cat artifacts/travel-free-agents/status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the single status issue
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          STATUS_FILE: artifacts/travel-free-agents/status.md
        with:
          script: |
            const fs = require('fs');
            const title = '[FREE AGENTS STATUS] ПРАКСЕЛЬТА Travel';
            let body = fs.readFileSync(process.env.STATUS_FILE, 'utf8');
            body += `\n\n---\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            body += `\nEvent: \`${context.eventName}\``;
            body += `\nCommit: \`${context.sha}\``;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (item) => !item.pull_request && item.title === title
            );
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Enforce critical gates
        if: always()
        shell: bash
        env:
          AGENTS_OUTCOME: ${{ steps.agents.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          failed=0
          for outcome in "$AGENTS_OUTCOME" "$PREFLIGHT_OUTCOME" "$TESTS_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"
