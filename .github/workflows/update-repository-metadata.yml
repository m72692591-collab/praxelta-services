name: Update canonical PRAXELTA repository metadata

on:
  push:
    branches:
      - "ops/repository-metadata-20260817"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-praxelta-repository-metadata
  cancel-in-progress: false

jobs:
  update-verify-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/repository-metadata-20260817
          fetch-depth: 0
          show-progress: false

      - name: Attempt exact repository metadata update
        id: patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_DESCRIPTION: "ПРАКСЕЛЬТА — управляемое продвижение локальных услуг и учёт обращений"
          EXPECTED_HOMEPAGE: "https://m72692591-collab.github.io/praxelta-services/"
        shell: bash
        run: |
          set -u
          mkdir -p .metadata-temp governance
          set +e
          gh api -X PATCH "repos/$GITHUB_REPOSITORY" \
            -f description="$EXPECTED_DESCRIPTION" \
            -f homepage="$EXPECTED_HOMEPAGE" \
            > .metadata-temp/patch.json 2> .metadata-temp/error.txt
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          GH_TOKEN="$GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY" \
            > .metadata-temp/current.json

          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          expected_description = os.environ['EXPECTED_DESCRIPTION']
          expected_homepage = os.environ['EXPECTED_HOMEPAGE']
          exit_code = int(os.environ.get('PATCH_EXIT_CODE', '0'))
          current = json.loads(Path('.metadata-temp/current.json').read_text(encoding='utf-8'))
          error_text = Path('.metadata-temp/error.txt').read_text(encoding='utf-8', errors='replace')[:1500]
          verified = (
              current.get('description') == expected_description
              and current.get('homepage') == expected_homepage
          )
          status = 'VERIFIED_UPDATED' if verified else 'BLOCKED_BY_REPOSITORY_ADMINISTRATION_PERMISSION'
          receipt = {
              'schema': 1,
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'status': status,
              'patch_exit_code': exit_code,
              'expected_description': expected_description,
              'actual_description': current.get('description'),
              'expected_homepage': expected_homepage,
              'actual_homepage': current.get('homepage'),
              'verified': verified,
              'error_summary': '' if verified else error_text,
              'secrets_recorded': False,
          }
          Path('governance/REPOSITORY_METADATA_RECEIPT.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, ensure_ascii=False, sort_keys=True))
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_DESCRIPTION: "ПРАКСЕЛЬТА — управляемое продвижение локальных услуг и учёт обращений"
          EXPECTED_HOMEPAGE: "https://m72692591-collab.github.io/praxelta-services/"
          PATCH_EXIT_CODE: ${{ steps.patch.outputs.exit_code }}

      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('governance/REPOSITORY_METADATA_RECEIPT.json').read_text(encoding='utf-8'))
          assert data['schema'] == 1
          assert data['secrets_recorded'] is False
          assert data['status'] in {'VERIFIED_UPDATED', 'BLOCKED_BY_REPOSITORY_ADMINISTRATION_PERMISSION'}
          if data['verified']:
              assert data['actual_description'] == data['expected_description']
              assert data['actual_homepage'] == data['expected_homepage']
          PY
          git diff --check

      - name: Commit receipt and remove one-shot workflow
        id: final
        run: |
          set -euo pipefail
          rm -rf .metadata-temp
          rm .github/workflows/update-repository-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Зафиксировать состояние метаданных репозитория ПРАКСЕЛЬТА"
          git push origin HEAD:ops/repository-metadata-20260817
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge exact receipt PR without deleting branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.final.outputs.sha }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head ops/repository-metadata-20260817 --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then exit 0; fi
          actual="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$actual" = "$HEAD_SHA"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash \
            --subject "Зафиксировать метаданные репозитория ПРАКСЕЛЬТА" \
            --body "Содержит проверенный результат обновления описания и homepage без записи секретов."
