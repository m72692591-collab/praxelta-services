name: ANIMA TACTUS VK source validation

on:
  pull_request:
    paths:
      - "scripts/vk_anima_manager.py"
      - "tests/test_vk_anima_manager.py"
      - "operations/vk-anima-tactus/content-plan.json"
      - ".github/workflows/vk-anima-manager.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anima-tactus-vk-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation runtime
        run: python -m pip install --disable-pip-version-check --no-input requests pillow
      - name: Validate manager and content plan
        run: |
          set -euo pipefail
          python -m py_compile scripts/vk_anima_manager.py tests/test_vk_anima_manager.py
          python -m unittest tests.test_vk_anima_manager -v
          python scripts/vk_anima_manager.py \
            --plan operations/vk-anima-tactus/content-plan.json \
            --dry-run
          python scripts/audit_brand_terms.py --root . --report /tmp/vk-brand.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/vk-brand.json').read_text(encoding='utf-8'))
          active = [item for item in data['findings'] if item['classification'] == 'ACTIVE_VIOLATION']
          if active:
              print(json.dumps(active, ensure_ascii=False, indent=2))
              raise SystemExit(1)
          PY
          git diff --check
